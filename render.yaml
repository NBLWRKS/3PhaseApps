# Render Blueprint for PhaseMaster (separate static site + API service).
# Deploy by pushing this repo to GitHub and creating a new Blueprint in Render
# pointed at it, OR create the two services manually using these settings.
#
# After the first deploy you'll know the two URLs Render assigns
# (e.g. phasemaster-web.onrender.com and phasemaster-api.onrender.com).
# Set the cross-referencing env vars marked "sync: false" below to those URLs
# (or to your custom domains), then redeploy.

services:
  # ---------- API (Node/Express + SQLite on a persistent disk) ----------
  - type: web
    name: phasemaster-api
    runtime: node
    plan: starter            # Persistent disks require a paid instance (not free).
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    disk:
      name: phasemaster-data
      mountPath: /var/data    # DATA_DIR and UPLOAD_DIR point here so the DB and
      sizeGB: 1               # uploaded photos survive deploys/restarts.
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: /var/data/db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong secret automatically.
      - key: OPEN_SIGNUP
        value: "true"
      - key: REQUIRE_OTP
        value: "false"
      # The API's own public URL (used to build absolute image/PDF links).
      # Set to this service's URL or your api custom domain after first deploy.
      - key: PUBLIC_URL
        sync: false
      # The frontend origin allowed to call this API (CORS).
      # Set to the static site's URL or your app custom domain.
      - key: CORS_ORIGIN
        sync: false
      # Optional: enables admin Spanish->English translation.
      # - key: ANTHROPIC_API_KEY
      #   sync: false

  # ---------- Frontend (static site built with Vite) ----------
  - type: web
    name: phasemaster-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA routing: serve index.html for any path so client-side routes work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Absolute URL of the API service, including the /api suffix.
      # e.g. https://phasemaster-api.onrender.com/api  (or your api domain).
      - key: VITE_API_BASE
        sync: false
