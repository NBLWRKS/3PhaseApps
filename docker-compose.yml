services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8080
      - DATA_DIR=/app/server/data
      - UPLOAD_DIR=/app/server/uploads
    volumes:
      - app-data:/app/server/data
      - app-uploads:/app/server/uploads
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  app-uploads:
  caddy-data:
  caddy-config:
